name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate site
        run: npx hexo generate

      - name: Deploy to dubingjie.github.io
        env:
          BLOG_TOKEN: ${{ secrets.BLOG_TOKEN }}
        run: |
          cd public
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Site updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push --force "https://x-access-token:${BLOG_TOKEN}@github.com/dubingjie/dubingjie.github.io.git" main
